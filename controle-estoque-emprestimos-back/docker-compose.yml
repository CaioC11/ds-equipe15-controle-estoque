services:
  postgres:
    image: postgres:14.2
    container_name: controle-estoque-emprestimos-postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-controle_estoque_emprestimos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-controle_estoque_emprestimos}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: controle-estoque-emprestimos-app
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-controle_estoque_emprestimos}
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npx nest start --watch

  keycloak-db:
    image: postgres:14.4-alpine
    container_name: controle-estoque-emprestimos-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - pg_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U keycloak -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:18.0.0
    container_name: controle-estoque-emprestimos-keycloak
    command:
      - start-dev
      - --http-relative-path=/auth
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: '5432'
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      TZ: America/Recife
    volumes:
      - ./setup/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - '8080:8080'
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  pg_keycloak_data:
